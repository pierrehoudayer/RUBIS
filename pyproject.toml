[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "rubis"
version = "1.1.0"
description = "Compute rotating barotropic stellar models"
readme = "README.md"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
]
dev = [
    "matplotlib",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-ra"
markers = [
    "slow: computationally expensive convergence tests",
    "acceptance: full-scale physical acceptance tests",
]