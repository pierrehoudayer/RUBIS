name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install RUBIS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -m "not slow and not acceptance"

  package:
    name: Build and inspect wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Read project version
        id: project
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          version = project["project"]["version"]

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"version={version}", file=output)
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/rubis-wheel"
          "${RUNNER_TEMP}/rubis-wheel/bin/python" -m pip install dist/*.whl

      - name: Check installed package
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ steps.project.outputs.version }}
        run: |
          "${RUNNER_TEMP}/rubis-wheel/bin/python" - <<'PY'
          import os

          import rubis
          from rubis import LegacyModelConfig

          assert rubis.__version__ == os.environ["EXPECTED_VERSION"]

          jupiter = LegacyModelConfig(filename="Jupiter.txt").path
          assert jupiter.is_file()
          assert jupiter.stat().st_size > 0

          print(f"RUBIS {rubis.__version__}")
          print(f"Jupiter model: {jupiter}")
          PY
